name: palatia

services:
  mysql:
    image: mysql:8
    container_name: palatia-mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-palatia_secret_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-palatia}
      MYSQL_USER: ${MYSQL_USER:-palatia_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-palatia_pass}
    volumes:
      - palatia_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${MYSQL_USER:-palatia_user}", "-p${MYSQL_PASSWORD:-palatia_pass}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: palatia-backend
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-palatia_user}:${MYSQL_PASSWORD:-palatia_pass}@mysql:3306/${MYSQL_DATABASE:-palatia}
      JWT_SECRET: ${JWT_SECRET:-palatia_super_secret_jwt_key_2026}
      PORT: 4000
      NODE_ENV: production
    ports:
      - "4000:4000"
    volumes:
      - palatia_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend-web
      dockerfile: Dockerfile
    container_name: palatia-frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  palatia_db_data:
  palatia_uploads:

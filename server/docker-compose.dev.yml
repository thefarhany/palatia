# Dev database. Production runs on belalang via docker-compose.prod.yml (built later).
services:
  mysql:
    image: mysql:8
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: palatia
      MYSQL_DATABASE: palatia
    ports:
      - "3306:3306"
    volumes:
      - palatia_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ppalatia"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s
volumes:
  palatia_mysql: